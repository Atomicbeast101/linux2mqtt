name: Build/Push App for Development
on:
  push:
    branches:
      - dev


jobs:
  release:
    name: Release
    steps:
      - name: Build&Push Image
        uses: https://${{ vars.LOCAL_REGISTRY_URL }}/${{ vars.LOCAL_REGISTRY_USERNAME }}/gitea-workflows-builder@dev
        with:
          registry_url: ${{ vars.LOCAL_REGISTRY_URL }}
          registry_username: ${{ vars.LOCAL_REGISTRY_USERNAME }}
          registry_password: ${{ secrets.LOCAL_REGISTRY_PASSWORD }}
          development: true

  report:
    name: Report
    if: always()
    continue-on-error: true
    needs:
      - release
    env:
      SUCCESS: ${{ needs.release.result == 'success'
    steps:
      - name: Notify User
        uses: https://${{ vars.LOCAL_REGISTRY_URL }}/${{ vars.LOCAL_REGISTRY_USERNAME }}/gitea-workflows-notification@main
        with:
          success: ${{ env.SUCCESS }}
          development: true
          tested: true
          pushover_user: ${{ secrets.PUSHOVER_USER }}
          pushover_token: ${{ secrets.PUSHOVER_TOKEN }}
